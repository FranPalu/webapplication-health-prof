components:
  schemas:
    AccessDecisionRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/ResearchAccessDecisionEnum'
      required:
      - decision
    AccessHistoryOutput:
      type: object
      properties:
        actor:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        at:
          type: string
          format: date-time
      required:
      - action
      - actor
      - at
    AccessInputRequest:
      type: object
      properties:
        purpose:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - purpose
    AccessOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
        purpose:
          type: string
          maxLength: 500
        status:
          type: string
          maxLength: 16
        checksum:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - organization
      - purpose
    AnalysisDecisionEnum:
      enum:
      - accept
      - modify
      - reject
      type: string
      description: |-
        * `accept` - accept
        * `modify` - modify
        * `reject` - reject
    AnalysisReviewInputRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/AnalysisDecisionEnum'
        text:
          type: string
          minLength: 1
          maxLength: 8000
        confirmed:
          type: boolean
          default: false
      required:
      - decision
      - text
    BookingInputRequest:
      type: object
      properties:
        payment:
          type: string
          format: uuid
    BookingOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slot:
          type: string
          format: uuid
        payment:
          type: string
          format: uuid
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          readOnly: true
      required:
      - created_at
      - ends_at
      - id
      - slot
      - starts_at
      - title
    BreakGlassInputRequest:
      type: object
      properties:
        patient:
