components:
  schemas:
    CodeInputRequest:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 100
      required:
      - code
    ConfirmPasswordInputRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
    EmailInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    KindEnum:
      enum:
      - hospital
      - clinic
      - practice
      - pharmacy
      - research
      type: string
      description: |-
        * `hospital` - hospital
        * `clinic` - clinic
        * `practice` - practice
        * `pharmacy` - pharmacy
        * `research` - research
    LinkInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    LoginInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    MFASetupOutput:
      type: object
      properties:
        uri:
          type: string
      required:
      - uri
    MembershipInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role:
          $ref: '#/components/schemas/MembershipRoleEnum'
        active:
          type: boolean
          default: true
      required:
      - email
      - role
    MembershipRoleEnum:
      enum:
      - admin
      - professional
      - researcher
      type: string
      description: |-
        * `admin` - admin
        * `professional` - professional
        * `researcher` - researcher
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - id
      - kind
      - name
    OrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - kind
      - name
    PaginatedOrganizationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    PaginatedPatientList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Patient'
    PaginatedVerificationOutputList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/VerificationOutput'
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - birth_date
      - first_name
      - id
      - last_name
      - organization
    PatientRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        birth_date:
          type: string
          format: date
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - birth_date
      - first_name
      - last_name
    ProfileInputRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/ProfileRoleEnum'
      required:
      - role
    ProfileRoleEnum:
      enum:
      - patient
      - professional
      - researcher
      - organization_admin
      type: string
      description: |-
        * `patient` - patient
        * `professional` - professional
        * `researcher` - researcher
        * `organization_admin` - organization_admin
    RecoveryOutput:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - recovery_codes
    RegisterInputLocaleEnum:
      enum:
      - it
      - en
      type: string
      description: |-
        * `it` - it
        * `en` - en
    RegisterInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
        role:
          $ref: '#/components/schemas/ProfileRoleEnum'
        locale:
          allOf:
          - $ref: '#/components/schemas/RegisterInputLocaleEnum'
          default: it
      required:
      - email
      - password
      - role
    RelationshipInputRequest:
      type: object
      properties:
        professional:
          type: string
          format: uuid
        active:
          type: boolean
          default: true
      required:
      - professional
    ResetInputRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 100
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
      required:
      - password
      - token
    ReviewInputRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ReviewInputStatusEnum'
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
      - status
    ReviewInputStatusEnum:
      enum:
      - approved
      - rejected
      type: string
      description: |-
        * `approved` - approved
        * `rejected` - rejected
    StatusOutput:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    StatusOutputRequest:
      type: object
      properties:
        status:
          type: string
          minLength: 1
      required:
      - status
    TokenInputRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 100
      required:
      - token
    UserOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/UserOutputRoleEnum'
        locale:
          $ref: '#/components/schemas/UserOutputLocaleEnum'
        email_verified:
          type: boolean
        requires_mfa:
          type: boolean
        mfa_enabled:
          type: boolean
        mfa_verified:
          type: boolean
          readOnly: true
        verification_status:
          type: string
          readOnly: true
        is_platform_admin:
          type: boolean
        profiles:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - email
      - id
      - is_platform_admin
      - mfa_verified
      - profiles
      - requires_mfa
      - role
      - verification_status
    UserOutputLocaleEnum:
      enum:
      - it
      - en
      type: string
      description: |-
        * `it` - Italiano
        * `en` - English
    UserOutputRoleEnum:
      enum:
      - patient
      - professional
      - researcher
      - organization_admin
      type: string
      description: |-
        * `patient` - Patient
        * `professional` - Professional
        * `researcher` - Researcher
        * `organization_admin` - Organization admin
    VerificationInputRequest:
      type: object
      properties:
        register:
          type: string
          minLength: 1
          maxLength: 200
        license_number:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - license_number
      - register
    VerificationOutput:
      type: object
      properties:
        user:
          type: string
          format: uuid
        register:
          type: string
          maxLength: 200
        license_number:
          type: string
          maxLength: 100
        status:
          $ref: '#/components/schemas/VerificationOutputStatusEnum'
        reason:
          type: string
          maxLength: 500
        reviewed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - license_number
      - register
      - user
    VerificationOutputStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - pending
        * `approved` - approved
        * `rejected` - rejected
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Server session. Mutating requests also require X-CSRFToken from
        csrftoken cookie.
