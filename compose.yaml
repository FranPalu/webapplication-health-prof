name: health-collaboration
services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run make env}
      POSTGRES_USER: ${POSTGRES_USER:?Run make env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.22
    command: [mini, '-dir=/data', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run make env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run make env}
      S3_BUCKET: ${S3_BUCKET:-health-local}
    volumes: [storage:/data]
  antivirus:
    image: clamav/clamav:1.4
    platform: linux/amd64
    volumes: [clamav:/var/lib/clamav]
    healthcheck:
      test: [CMD, clamdscan, --ping, '1']
      interval: 5s
      timeout: 5s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27.4
    ports: ['127.0.0.1:8025:8025']
  migrate:
    build: ./backend
    env_file: .env.dev
    environment:
      S3_ENDPOINT: http://storage:8333
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py seed_demo']
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    env_file: .env.dev
    tmpfs: ["/tmp:size=256m,mode=1777"]
    environment:
      CLINICAL_ANALYSIS_ENABLED: ${CLINICAL_ANALYSIS_ENABLED:-0}
      CLINICAL_CLAMAV_HOST: antivirus
      S3_ENDPOINT: http://storage:8333
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mail: {condition: service_started}
      antivirus: {condition: service_healthy}
      storage: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health/")']
      interval: 5s
      retries: 20
  worker:
    build: ./backend
    env_file: .env.dev
    environment:
      S3_ENDPOINT: http://storage:8333
    command: [celery, -A, config.celery, worker, -Q, celery, --loglevel=WARNING]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  analysis-worker:
    profiles: [analysis]
    build:
      context: ./backend
      dockerfile: Dockerfile.analysis
    env_file: .env.dev
    environment:
      CLINICAL_ANALYSIS_ENABLED: ${CLINICAL_ANALYSIS_ENABLED:-0}
      S3_ENDPOINT: http://storage:8333
    command: [celery, -A, config.celery, worker, -Q, clinical-analysis, --concurrency=1, --loglevel=WARNING]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes: ["./.analysis-models:/models:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  imaging-smoke:
    profiles: [imaging-test]
    build: ./infra/imaging
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    volumes: ["./.analysis-models:/models:ro", "./.analysis-fixtures:/fixtures:ro"]
  beat:
    build: ./backend
    env_file: .env.dev
    environment:
      CLINICAL_ANALYSIS_ENABLED: ${CLINICAL_ANALYSIS_ENABLED:-0}
    command: [celery, -A, config.celery, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat]
    depends_on:
      worker: {condition: service_started}
  frontend:
    build: .
    depends_on:
      backend: {condition: service_healthy}
  proxy:
    image: nginx:1.28.0-alpine
    volumes: ['./infra/nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:8080:8080']
    depends_on: [frontend, backend]
volumes:
  postgres:
  redis:
  storage:
  clamav:
