name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: health
          POSTGRES_USER: health
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U health -d health"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: health
      POSTGRES_DB: health
      DJANGO_DEBUG: 'true'
      PUBLIC_ORIGIN: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
      - name: Audit Python dependencies and scan source
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install pip-audit==2.10.1 bandit==1.9.4 semgrep==1.184.0
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" -r backend/requirements.txt
          "$RUNNER_TEMP/audit-venv/bin/bandit" -r backend/config backend/identity infra/imaging scripts/check_qms.py -ll
          "$RUNNER_TEMP/audit-venv/bin/semgrep" scan --config p/typescript --config p/secrets --metrics off --error app lib backend/config backend/identity infra/imaging scripts/check_qms.py
      - run: python scripts/dev-env.py
      - run: .venv/bin/ruff check backend scripts/check_qms.py tests/qms_test.py && .venv/bin/ruff format --check backend scripts/check_qms.py tests/qms_test.py
      - run: .venv/bin/mypy --explicit-package-bases scripts/check_qms.py tests/qms_test.py
      - run: python scripts/backend.py ../.venv/bin/mypy config identity
      - run: python scripts/backend.py ../.venv/bin/python manage.py makemigrations --check --dry-run
      - run: python scripts/backend.py ../.venv/bin/pytest --no-cov
      - run: python scripts/backend.py ../.venv/bin/pytest -o addopts= tests/test_clinical_calculators.py --cov=identity.clinical_calculators --cov-branch --cov-fail-under=100
      - run: python scripts/check_qms.py && python -m unittest discover -s tests -p qms_test.py
      - run: python -m unittest discover -s infra/imaging -p test_contract.py
      - run: python scripts/backend.py ../.venv/bin/python manage.py migrate identity 0001 --noinput
      - run: python scripts/backend.py ../.venv/bin/python manage.py migrate --noinput
      - run: python scripts/backend.py ../.venv/bin/python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
      - run: pnpm api:types && git diff --exit-code -- backend/openapi.yaml lib/api/schema.d.ts
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: python tests/database_test.py
      - run: pnpm build
      - run: docker compose --env-file .env.dev config --quiet
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser integration
        run: |
          python scripts/backend.py ../.venv/bin/python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/backend.log 2>&1 &
          pnpm start > /tmp/frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/auth/session/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:e2e
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: make dev
      - name: Container smoke test
        run: |
          for attempt in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/v1/auth/session/ > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/health/
          curl -fsS http://localhost:8080/health/ready/
          curl -fsS http://localhost:8080/api/v1/auth/session/
          docker compose --env-file .env.dev run --rm -e CLINICAL_INTEGRATION_TEST=1 backend pytest -p no:cacheprovider
      - name: Synthetic database restore drill
        run: bash scripts/restore-drill.sh
      - name: Browser smoke test with synthetic clinical fixture
        run: |
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          docker compose --env-file .env.dev exec -T backend python manage.py shell -v 0 \
            < backend/tests/clinical_browser_fixture.py > "$fixture"
          E2E_CLINICAL_FIXTURE="$fixture" E2E_BASE_URL=http://localhost:8080 \
            pnpm exec playwright test -g 'professional uploads|patient grants|workspace shortcuts|real workspace operation'
      - if: always()
        run: docker compose --env-file .env.dev down
  supervised-analysis:
    runs-on: ubuntu-latest
    env:
      CLINICAL_ANALYSIS_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Fetch pinned public model for synthetic testing
        run: |
          mkdir -p .analysis-models
          curl --fail --location --retry 3 'https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/dd26da4/qwen2.5-1.5b-instruct-q4_k_m.gguf' -o .analysis-models/qwen.gguf
          echo '6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  .analysis-models/qwen.gguf' | sha256sum --check
      - run: make dev
      - run: docker compose --env-file .env.dev --profile analysis up -d --build analysis-worker
      - name: Evaluate real local OCR and LLM on synthetic sources
        run: docker compose --env-file .env.dev run --rm --no-deps analysis-worker python manage.py analysis_smoke
      - name: Verify patient cannot receive an unsigned opinion
        run: |
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          docker compose --env-file .env.dev exec -T backend python manage.py shell -v 0 < backend/tests/clinical_browser_fixture.py > "$fixture"
          E2E_CLINICAL_FIXTURE="$fixture" E2E_ANALYSIS=1 E2E_BASE_URL=http://localhost:8080 pnpm exec playwright test -g 'professional reviews local analysis'
      - if: always()
        run: docker compose --env-file .env.dev down
  imaging-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t claria-imaging-audit infra/imaging
      - run: docker run --rm --network none --read-only --tmpfs /tmp:size=32m,mode=1777 --entrypoint python claria-imaging-audit -m unittest test_conversion
      - run: python -m venv "$RUNNER_TEMP/imaging-audit" && "$RUNNER_TEMP/imaging-audit/bin/pip" install pip-audit==2.10.1
      - name: Audit actual offline imaging runtime
        run: |
          docker run --rm --network none --read-only --entrypoint python claria-imaging-audit -m pip freeze --all | sed 's/+cpu$//' > "$RUNNER_TEMP/imaging.txt"
          "$RUNNER_TEMP/imaging-audit/bin/pip-audit" -r "$RUNNER_TEMP/imaging.txt" --no-deps --disable-pip
  interoperability:
    runs-on: ubuntu-latest
    env:
      FHIR_INTEROP_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python scripts/dev-env.py
      - run: docker compose --env-file .env.dev --profile pacs up -d --build db redis storage antivirus mail orthanc
      - run: docker compose --env-file .env.dev build backend
      - name: Wait for isolated integration dependencies
        run: |
          for attempt in $(seq 1 120); do
            if docker compose --env-file .env.dev exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' && docker compose --env-file .env.dev exec -T antivirus clamdscan --ping 1; then break; fi
            sleep 2
          done
          docker compose --env-file .env.dev exec -T db sh -c 'createdb -U "$POSTGRES_USER" health_p5_research'
      - name: FHIR, HL7, OAuth scopes, research consent and actual DICOMweb tests
        run: |
          mkdir -p "$RUNNER_TEMP/p5-evidence"
          chmod 777 "$RUNNER_TEMP/p5-evidence"
          docker compose --env-file .env.dev run --rm --no-deps -v "$RUNNER_TEMP/p5-evidence:/reports" -e CLINICAL_INTEGRATION_TEST=1 -e PACS_INTEGRATION_TEST=1 -e RESEARCH_INTEGRATION_DB=health_p5_research -e FHIR_VALIDATION_OUTPUT=/reports/fhir-fixtures backend pytest -p no:cacheprovider --junitxml=/reports/django.xml --cov-report=xml:/reports/coverage.xml
      - name: Validate actual synthetic API resources with official pinned HL7 validator
        run: |
          curl --fail --location --retry 3 'https://github.com/hapifhir/org.hl7.fhir.core/releases/download/7.0.5/validator_cli.jar' -o "$RUNNER_TEMP/validator_cli.jar"
          echo '9dfe9f305b0f9389eceade2a4a1c9a2740d7b0e614066fdf07a78b571c76d92f  '"$RUNNER_TEMP/validator_cli.jar" | sha256sum --check
          java -Xmx1g -jar "$RUNNER_TEMP/validator_cli.jar" "$RUNNER_TEMP/p5-evidence/fhir-fixtures/claria-p5-validation.json" -version 4.0.1 -tx n/a -output "$RUNNER_TEMP/p5-evidence/fhir-validation.json"
          python scripts/check_fhir_validation.py "$RUNNER_TEMP/p5-evidence/fhir-validation.json"
          python -m unittest discover -s tests -p fhir_validation_test.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-synthetic-interoperability-evidence
          path: ${{ runner.temp }}/p5-evidence
      - if: always()
        run: docker compose --env-file .env.dev --profile pacs down
